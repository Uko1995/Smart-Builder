# Local PostgreSQL only. The Next.js and FastAPI processes run on the host
# so a sleeping container is not required for day-to-day development.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spl
      POSTGRES_PASSWORD: spl
      POSTGRES_DB: soccer_prediction_lab
    ports:
      - "5432:5432"
    volumes:
      - spl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spl -d soccer_prediction_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spl_pg:
